<!doctype html>
<html lang="vi">
  <head>
    <script>
      if (typeof window !== 'undefined' && window.fetch) {
        try {
          var _origFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            writable: true,
            value: _origFetch,
          });
        } catch (e) {}
      }
    </script>

  </head>
